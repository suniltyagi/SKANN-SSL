# SKANN-SSL Stage 3 V2.1.0 Run Metadata
# =======================================
# Run ID: 2026-01-07_kaggle_v2.1.0_underwater
# Platform: Kaggle (Dual NVIDIA T4 GPUs)

run_id: "2026-01-07_kaggle_v2.1.0_underwater"
date: "2026-01-07"
platform: "kaggle"
hardware: "dual_t4_gpu"
version: "v2.1.0_physics_aware"
status: "production"

# =============================================================================
# KEY CHANGES FROM V1
# =============================================================================
changes_from_v1:
  frontend:
    v1: "Conv1d(1, 128, k=31, s=4)"
    v2: "SKFilterbank(64) -> AvgPool1d(8) -> channel_bridge(64->128)"
  multi_scale:
    v1: "Fixed single kernel"
    v2: "Attention-weighted fusion of kernels [31, 63, 127, 255, 511, 1023]"
  frequency_coverage:
    v1: "Limited (missed low-frequency signatures)"
    v2: "15 Hz to 500+ Hz (full vessel acoustic range)"

# =============================================================================
# TRAINING CONFIGURATION
# =============================================================================
training:
  epochs: 50
  batch_size_per_gpu: 4
  num_gpus: 2
  gradient_accumulation: 1  # Not used in V2.1
  effective_batch_size: 8   # 4 * 2 GPUs
  optimizer: "AdamW"
  learning_rate: 1.0e-4
  weight_decay: 0.01
  scheduler: "CosineAnnealingLR"
  distributed: true
  ddp_backend: "nccl"

# =============================================================================
# MODEL ARCHITECTURE
# =============================================================================
model:
  name: "HybridSKEncoderV2"
  latent_dim: 128
  sk_kernels: [31, 63, 127, 255, 511, 1023]
  sk_reduction: 16
  sk_norm: "gn"  # GroupNorm
  sk_act: "gelu"
  channel_bridge: "Conv1d(64, 128, k=3, p=1)"
  normalization: "SyncBatchNorm"
  total_params_training: "34.4M"
  total_params_inference: "1.8M"

# Kernel frequency coverage @ 16kHz
kernel_frequency_coverage:
  k_31: {min_hz: 500, phenomenon: "cavitation"}
  k_63: {min_hz: 250, phenomenon: "hull_resonance"}
  k_127: {min_hz: 125, phenomenon: "blade_pass"}
  k_255: {min_hz: 62, phenomenon: "generator_50hz"}
  k_511: {min_hz: 31, phenomenon: "generator_25hz"}
  k_1023: {min_hz: 15, phenomenon: "shaft_rate"}

# =============================================================================
# SSL CONFIGURATION
# =============================================================================
ssl:
  method: "barlow_twins"
  lambda: 0.005
  projector: [512, 4096, 8192, 128]

# =============================================================================
# DATASET
# =============================================================================
dataset:
  name: "SKANN-SSL Synthetic Prototype"
  total_clips: 1920
  classes: ["cargo_ship", "fishing_vessel", "small_craft", "tanker"]
  clips_per_class: 480
  sample_rate: 16000
  duration_seconds: 1.0

# =============================================================================
# UMAP VISUALIZATION PARAMETERS
# =============================================================================
umap:
  n_neighbors: 15
  min_dist: 0.1
  metric: "cosine"
  random_state: 42

# =============================================================================
# RESULTS
# =============================================================================
results:
  # SSL embedding quality
  silhouette_score_cosine: 0.8299
  
  # Per-class centroid statistics
  per_class:
    cargo_ship:
      n_samples: 480
      mean_dist_to_centroid: 8.6468
      radius_95_percentile: 20.4613
    fishing_vessel:
      n_samples: 480
      mean_dist_to_centroid: 6.7800
      radius_95_percentile: 15.2871
    small_craft:
      n_samples: 480
      mean_dist_to_centroid: 4.6311
      radius_95_percentile: 11.3345
    tanker:
      n_samples: 480
      mean_dist_to_centroid: 8.3199
      radius_95_percentile: 18.9684
  
  # Inter-class separation
  inter_class:
    closest_pair: ["cargo_ship", "tanker"]
    closest_distance_cosine: 0.0802
    most_distant_pair: ["cargo_ship", "small_craft"]
    most_distant_cosine: 0.3831

  # Stage 6 evaluation (PENDING)
  stage6_accuracy: null  # To be evaluated
  cargo_recall: null     # To be evaluated
  cargo_tanker_confusion: null  # To be evaluated

# =============================================================================
# COMPARISON TO V1 BASELINE
# =============================================================================
v1_baseline:
  run_id: "2025-12-29_kaggle_baseline"
  silhouette_score_cosine: 0.3997
  stage6_accuracy: 0.782
  cargo_recall: 0.594
  cargo_tanker_confusion: 0.327
  architecture: "Fixed Conv1d (no SK attention)"

improvement:
  silhouette_factor: 2.08
  silhouette_percent: 107.6
  key_fix: "Underwater-appropriate SK kernel sizes (31-1023)"

# =============================================================================
# OUTPUT ARTIFACTS
# =============================================================================
artifacts:
  weights: "SKANN_SSL_V2_Final.pth"
  bundle: "SKANN_SSL_V2_Production_Bundle.joblib"
  loss_history: "loss_history.txt"
  
  diagnostics:
    umap: "diagnostics/umap.png"
    tsne: "diagnostics/tsne.png"
    silhouette: "diagnostics/silhouette_analysis.png"
    territory_map: "diagnostics/territory_map.png"


